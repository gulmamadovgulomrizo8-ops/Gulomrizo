<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gulomrizo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
        }

        .container {
            padding: 40px 20px;
            max-width: 900px;
            margin: auto;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        img {
            width: 180px;
            border-radius: 50%;
            margin: 25px 0;
            border: 4px solid white;
        }

        button {
            margin-top: 25px;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #764ba2;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ddd;
        }

        footer {
            margin-top: 50px;
            font-size: 14px;
            opacity: 0.8;
        }

        /* 📱 Telefon uchun */
        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            p {
                font-size: 18px;
            }

            img {
                width: 140px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Salom! 👋</h1>

        <!-- 🖼️ Rasm -->
        <img src="https://i.imgur.com/1Q9Z1Zm.png" alt="Profile">

        <p>Bu mening <b>GitHub Pages</b> орқали очилган шахсий сайтим.</p>
        <p>Исмим: <b>Gulomrizo</b></p>

        <!-- 🔘 Tugma -->
        <button onclick="alert('Rahmat, jigar! 😄')">
            Menga bos!
        </button>

        <footer>
            © 2026 Gulomrizo | Made with ❤️
        </footer>
    </div>

</body>
</html>
